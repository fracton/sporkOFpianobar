[package]
name = "pianobar-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
blowfish = "0.9"
byteorder = "1"
cipher = "0.4"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
urlencoding = "2"
